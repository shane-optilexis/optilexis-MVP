name: Backend tests
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r services/journey-api/requirements-dev.txt
      - name: Run tests
        working-directory: services/journey-api
        run: python -m pytest
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: optilexis_test
          POSTGRES_PASSWORD: local-ci-only-pass
          POSTGRES_DB: optilexis_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U optilexis_test -d optilexis_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://optilexis_test:local-ci-only-pass@127.0.0.1:5432/optilexis_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r services/journey-api/requirements-dev.txt
      - name: Verify actual PostgreSQL schema and owner isolation
        working-directory: services/journey-api
        run: python -m pytest -q tests/test_postgres_integration.py
